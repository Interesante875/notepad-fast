name: Release

# staging    -> build all platform binaries (downloadable workflow artifacts)
# production -> build all platform binaries and publish a GitHub release
# tags v*    -> same as production, using the tag name
on:
  push:
    branches: [staging, production]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: notepad-fast }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: notepad-fast }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: notepad-fast.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, exe: notepad-fast.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: notepad-fast }
          - { os: macos-latest, target: x86_64-apple-darwin, exe: notepad-fast }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test (native targets only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-apple-darwin'
        run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=notepad-fast-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} README.md LICENSE dist/$name/
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then 7z a $name.zip $name; else tar czf $name.tar.gz $name; fi
      - uses: actions/upload-artifact@v4
        with:
          name: notepad-fast-${{ matrix.target }}
          path: dist/notepad-fast-${{ matrix.target }}.*

  publish:
    if: github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            echo "tag=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
