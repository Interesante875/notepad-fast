name: CI

on:
  push:
    branches: [main, develop, staging, production, "feature/**", "claude/**"]
  pull_request:
    branches: [main, develop, staging, production]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --all-targets

  e2e:
    name: end-to-end (real window, clipboard, input methods)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install X11 test tools, fonts and input methods
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool xclip imagemagick python3-xlib dbus-x11 \
            ibus ibus-libpinyin ibus-hangul ibus-kkc fonts-noto-cjk fonts-noto-core \
            libxkbcommon-x11-0 libgl1-mesa-dri
      - run: cargo build --release
      - run: mkdir -p e2e-shots && E2E_SHOTS=$PWD/e2e-shots scripts/e2e.sh native
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots

  cross:
    name: cross-compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-compiled from Linux.
          - { os: ubuntu-latest, target: x86_64-pc-windows-gnu, apt: gcc-mingw-w64-x86-64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, apt: gcc-aarch64-linux-gnu }
          # Cross-compiled on the host OS for another architecture.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
